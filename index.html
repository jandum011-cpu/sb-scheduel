<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Tasks</title>
<style>
:root{
  --bg:#fafbfc; --panel:#fff; --border:#e5e8ec; --text:#1c2128; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eaf1ff; --danger:#dc2626; --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;height:100vh;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.app{display:grid;grid-template-columns:240px 1fr 320px;height:100vh;}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;overflow-y:auto;}
.logo{font-weight:700;font-size:18px;padding:8px 10px 18px;display:flex;align-items:center;gap:8px;}
.logo .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:8px;color:var(--text);font-size:14px;margin-bottom:2px;position:relative;}
.list-item button.select{all:unset;flex:1;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;}
.list-item button.select span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-item:hover{background:var(--bg);}
.list-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.list-item .count{font-size:12px;color:var(--muted);margin-left:6px;}
.list-item.active .count{color:var(--accent);}
.list-actions{display:none;gap:2px;}
.list-item:hover .list-actions{display:flex;}
.icon-btn{all:unset;padding:4px;border-radius:6px;color:var(--muted);display:flex;}
.icon-btn:hover{background:var(--border);color:var(--text);}
.new-list-btn{all:unset;margin-top:10px;padding:9px 10px;border-radius:8px;color:var(--accent);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;}
.new-list-btn:hover{background:var(--accent-soft);}
.main{padding:20px 28px;overflow-y:auto;min-width:0;}
.main-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;}
.main-header h1{font-size:22px;margin:0;font-weight:700;}
.header-actions{display:flex;gap:6px;align-items:center;}
.header-actions .icon-btn{padding:8px;}
.add-task-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;}
.add-task-row input{border:none;outline:none;background:transparent;flex:1;font-size:14px;color:var(--text);}
.add-task-row .plus{color:var(--accent);font-size:18px;font-weight:600;}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--muted);}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.sortsel{margin-left:auto;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:12.5px;color:var(--text);}
.task-row{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;}
.task-row.selected{border-color:var(--accent);}
.task-row.dragover{border-top:2px solid var(--accent);}
.checkbox{width:19px;height:19px;border-radius:50%;border:2px solid #9aa4b2;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;}
.checkbox.done{background:var(--accent);border-color:var(--accent);color:#fff;font-size:11px;}
.task-body{flex:1;min-width:0;}
.task-title{font-size:14px;line-height:1.35;word-break:break-word;}
.task-row.done .task-title{color:var(--muted);text-decoration:line-through;}
.task-meta{display:flex;gap:10px;margin-top:3px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center;}
.task-meta .overdue{color:var(--danger);}
.grip{color:var(--border);cursor:grab;padding-top:2px;user-select:none;}
.section-label{font-size:12.5px;color:var(--muted);font-weight:600;margin:18px 0 8px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:15px;color:var(--text);margin-bottom:4px;font-weight:600;}
.details{background:var(--panel);border-left:1px solid var(--border);padding:20px;overflow-y:auto;}
.details h3{margin:0 0 14px;font-size:16px;}
.field-label{font-size:12px;color:var(--muted);margin:14px 0 5px;font-weight:600;}
.field-label:first-of-type{margin-top:0;}
.details input[type=text],.details input[type=date],.details input[type=time],.details select,.details textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--text);background:var(--bg);outline:none;}
.details textarea{resize:vertical;min-height:56px;}
.details input:focus,.details select:focus,.details textarea:focus{border-color:var(--accent);}
.subtask-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.subtask-row .checkbox{width:16px;height:16px;}
.subtask-row input[type=text]{border:none;background:transparent;padding:2px;}
.subtask-progress{font-size:12px;color:var(--muted);margin-bottom:8px;}
.add-subtask{all:unset;color:var(--accent);font-size:13px;cursor:pointer;padding:4px 0;}
.details-actions{display:flex;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.danger{color:var(--danger);}
.close-details{all:unset;float:right;color:var(--muted);cursor:pointer;padding:4px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.toast button{all:unset;color:var(--accent);font-weight:600;cursor:pointer;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:center;justify-content:center;}
.confirm-box{background:var(--panel);border-radius:12px;padding:20px;width:280px;}
.confirm-box p{font-size:14px;margin:0 0 16px;}
.confirm-box .row{display:flex;gap:8px;justify-content:flex-end;}
.search-box{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:45;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;}
.search-panel{background:var(--panel);border-radius:12px;width:480px;max-width:92vw;max-height:70vh;overflow-y:auto;padding:14px;}
.search-panel input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;margin-bottom:10px;}
.search-result{padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;}
.search-result:hover{background:var(--bg);}
.search-result .ctx{color:var(--muted);font-size:12px;}
.assignee-badge{width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.people-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;font-size:13.5px;border-bottom:1px solid var(--border);}
.people-row:last-child{border-bottom:none;}
.people-add{display:flex;gap:8px;margin-top:10px;}
.people-add input{flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;background:var(--bg);color:var(--text);outline:none;}
.status-bar{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;font-size:12.5px;text-align:center;padding:6px;z-index:60;display:none;}
@media(max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;width:230px;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .details{position:fixed;right:0;top:0;bottom:0;width:100%;max-width:360px;z-index:35;transform:translateX(100%);transition:transform .2s;}
  .details.open{transform:translateX(0);}
  .main{padding:14px 14px 80px;}
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;}
  .sidebar-scrim.open{display:block;}
}
</style>
</head>
<body>
<div class="status-bar" id="statusBar">Can't reach the server. Changes may not be saved.</div>
<div class="app">
  <div class="sidebar-scrim" id="scrim"></div>
  <div class="sidebar" id="sidebar">
    <div class="logo"><span class="dot"></span>My Tasks</div>
    <div id="listNav"></div>
    <button class="new-list-btn" id="newListBtn">+ Create new list</button>
  </div>
  <div class="main">
    <div class="main-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="icon-btn" id="menuBtn" style="display:none;">☰</button>
        <h1 id="mainTitle">My Tasks</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="peopleBtn" title="People">👤</button>
        <button class="icon-btn" id="searchBtn" title="Search">🔍</button>
      </div>
    </div>
    <div class="add-task-row">
      <span class="plus">+</span>
      <input id="addInput" type="text" placeholder="Add a task">
    </div>
    <div class="toolbar" id="filterBar"></div>
    <div id="taskListWrap"></div>
  </div>
  <div class="details" id="details"><div id="detailsInner"></div></div>
</div>
<div id="toastHost"></div>

<script>
// Point this at your API if it's not served from the same folder as this file.
const API_BASE = 'api/';

async function api(path, opts) {
  opts = opts || {};
  try {
    const res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers: opts.body ? {'Content-Type':'application/json'} : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    setOnline(true);
    if (!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  } catch (e) {
    setOnline(false);
    throw e;
  }
}
function setOnline(ok){ $('#statusBar').style.display = ok ? 'none' : 'block'; }

const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{let d=new Date();d.setHours(0,0,0,0);return d;};
const fmtDate=(iso)=>{
  if(!iso)return '';
  const d=new Date(iso+'T00:00:00'), t=today();
  const diff=Math.round((d-t)/86400000);
  if(diff===0)return 'Today';
  if(diff===1)return 'Tomorrow';
  if(diff===-1)return 'Yesterday';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
};
const isOverdue=(iso,done)=> iso && !done && new Date(iso+'T00:00:00')<today();

let state = { lists: [], people: [], tasks: [] };
let ui = { activeList: null, filter: 'all', sort: 'myorder', selectedTask: null, dragId: null };

const $=(s)=>document.querySelector(s);
const listNav=$('#listNav'), taskWrap=$('#taskListWrap'), filterBar=$('#filterBar'), details=$('#details'), detailsInner=$('#detailsInner'), mainTitle=$('#mainTitle');

async function init(){
  try{
    const [lists, people] = await Promise.all([api('lists.php'), api('people.php')]);
    state.lists = lists; state.people = people;
    ui.activeList = (lists.find(l=>l.id==='l-mytasks') || lists[0] || {}).id || null;
    if(ui.activeList) state.tasks = await api('tasks.php?list_id='+encodeURIComponent(ui.activeList));
  }catch(e){ /* offline banner already shown */ }
  renderAll();
}

async function loadTasksForActiveList(){
  if(!ui.activeList){ state.tasks=[]; return; }
  try{ state.tasks = await api('tasks.php?list_id='+encodeURIComponent(ui.activeList)); }catch(e){}
}
async function refreshLists(){
  try{ state.lists = await api('lists.php'); }catch(e){}
}

function renderAll(){ renderSidebar(); renderFilterBar(); renderTasks(); renderDetails(); }

function renderSidebar(){
  listNav.innerHTML='';
  state.lists.forEach(l=>{
    const row=document.createElement('div');
    row.className='list-item'+(ui.activeList===l.id?' active':'');
    row.innerHTML=`<button class="select"><span class="name"></span></button><span class="count">${l.count||''}</span><div class="list-actions">${l.fixed?'':'<button class="icon-btn rn" title="Rename">✎</button><button class="icon-btn del" title="Delete">🗑</button>'}</div>`;
    row.querySelector('.name').textContent=l.name;
    row.querySelector('.select').onclick=async ()=>{
      ui.activeList=l.id; ui.selectedTask=null; closeSidebarMobile();
      renderSidebar();
      await loadTasksForActiveList();
      renderTasks(); renderDetails();
    };
    if(!l.fixed){
      row.querySelector('.rn').onclick=async (e)=>{
        e.stopPropagation();
        const nn=prompt('Rename list',l.name);
        if(nn&&nn.trim()){
          await api('lists.php',{method:'PUT',body:{id:l.id,name:nn.trim()}});
          await refreshLists(); renderSidebar(); renderTasks();
        }
      };
      row.querySelector('.del').onclick=(e)=>{
        e.stopPropagation();
        confirmDialog(`Delete list "${l.name}" and its tasks?`,async ()=>{
          await api('lists.php?id='+encodeURIComponent(l.id),{method:'DELETE'});
          if(ui.activeList===l.id) ui.activeList = (state.lists.find(x=>x.id==='l-mytasks')||{}).id;
          await refreshLists();
          await loadTasksForActiveList();
          renderAll();
        });
      };
    }
    listNav.appendChild(row);
  });
}
$('#newListBtn').onclick=async ()=>{
  const name=prompt('New list name');
  if(name&&name.trim()){
    const l=await api('lists.php',{method:'POST',body:{name:name.trim()}});
    ui.activeList=l.id;
    await refreshLists();
    await loadTasksForActiveList();
    renderAll();
  }
};

function renderFilterBar(){
  const filters=[['all','All'],['today','Today'],['upcoming','Upcoming'],['overdue','Overdue'],['completed','Completed']];
  filterBar.innerHTML='';
  filters.forEach(([key,label])=>{
    const c=document.createElement('button'); c.className='chip'+(ui.filter===key?' active':''); c.textContent=label; c.style.border='none';
    c.onclick=()=>{ui.filter=key; renderFilterBar(); renderTasks();};
    filterBar.appendChild(c);
  });
  const sel=document.createElement('select'); sel.className='sortsel';
  sel.innerHTML=`<option value="myorder">My order</option><option value="date">Date</option><option value="created">Recently created</option><option value="alpha">Alphabetical</option>`;
  sel.value=ui.sort;
  sel.onchange=()=>{ui.sort=sel.value; renderTasks();};
  filterBar.appendChild(sel);
}

function visibleTasks(){
  let list=state.tasks;
  const t0=today();
  if(ui.filter==='today') list=list.filter(t=>!t.done && t.dueDate===t0.toISOString().slice(0,10));
  else if(ui.filter==='upcoming') list=list.filter(t=>!t.done && t.dueDate && new Date(t.dueDate+'T00:00:00')>t0);
  else if(ui.filter==='overdue') list=list.filter(t=>isOverdue(t.dueDate,t.done));
  else if(ui.filter==='completed') list=list.filter(t=>t.done);
  return list;
}
function sortTasks(list){
  const arr=[...list];
  if(ui.sort==='date') arr.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  else if(ui.sort==='created') arr.sort((a,b)=>b.order-a.order);
  else if(ui.sort==='alpha') arr.sort((a,b)=>a.title.localeCompare(b.title));
  else arr.sort((a,b)=>a.order-b.order);
  return arr;
}

function renderTasks(){
  const activeListObj=state.lists.find(l=>l.id===ui.activeList);
  mainTitle.textContent=activeListObj?activeListObj.name:'Tasks';
  const all=visibleTasks();
  const incomplete=sortTasks(all.filter(t=>!t.done));
  const completed=sortTasks(all.filter(t=>t.done));
  taskWrap.innerHTML='';
  if(incomplete.length===0 && completed.length===0){
    taskWrap.innerHTML=`<div class="empty-state"><div class="big">No tasks yet</div>Add a task to get started.</div>`;
    return;
  }
  incomplete.forEach(t=>taskWrap.appendChild(taskRow(t)));
  if(completed.length){
    const label=document.createElement('div'); label.className='section-label';
    label.innerHTML=`<span id="compArrow">▾</span> Completed (${completed.length})`;
    let collapsed=false;
    label.onclick=()=>{collapsed=!collapsed; box.style.display=collapsed?'none':'block'; label.querySelector('#compArrow').textContent=collapsed?'▸':'▾';};
    taskWrap.appendChild(label);
    const box=document.createElement('div');
    completed.forEach(t=>box.appendChild(taskRow(t)));
    taskWrap.appendChild(box);
  }
}

function taskRow(t){
  const row=document.createElement('div');
  row.className='task-row'+(t.done?' done':'')+(ui.selectedTask===t.id?' selected':'');
  row.draggable=true;
  row.ondragstart=()=>{ui.dragId=t.id;};
  row.ondragover=(e)=>{e.preventDefault(); row.classList.add('dragover');};
  row.ondragleave=()=>row.classList.remove('dragover');
  row.ondrop=async (e)=>{
    e.preventDefault(); row.classList.remove('dragover');
    if(!ui.dragId||ui.dragId===t.id)return;
    const dragT=state.tasks.find(x=>x.id===ui.dragId);
    if(!dragT)return;
    dragT.order=t.order-0.5;
    renderTasks();
    await api('tasks.php',{method:'PUT',body:{id:dragT.id,order:dragT.order}});
  };
  const subCount = t.subtasks.length ? `${t.subtasks.filter(s=>s.done).length} of ${t.subtasks.length} completed` : '';
  row.innerHTML=`
    <span class="grip">⠿</span>
    <button class="checkbox ${t.done?'done':''}">${t.done?'✓':''}</button>
    <div class="task-body">
      <div class="task-title"></div>
      <div class="task-meta"></div>
    </div>`;
  row.querySelector('.task-title').textContent=t.title;
  const meta=row.querySelector('.task-meta');
  if(t.dueDate) meta.innerHTML+=`<span class="${isOverdue(t.dueDate,t.done)?'overdue':''}">${fmtDate(t.dueDate)}${t.dueTime?' · '+t.dueTime:''}</span>`;
  if(t.desc) meta.innerHTML+=`<span>📄</span>`;
  if(subCount) meta.innerHTML+=`<span>${subCount}</span>`;
  const person=state.people.find(p=>p.id===t.assigneeId);
  if(person) meta.innerHTML+=`<span class="assignee-badge" title="${escapeAttr(person.name)}">${person.name.trim().charAt(0).toUpperCase()}</span>`;
  row.querySelector('.checkbox').onclick=(e)=>{e.stopPropagation(); toggleDone(t);};
  row.onclick=()=>{ui.selectedTask=t.id; renderTasks(); renderDetails(); openDetailsMobile();};
  return row;
}

async function toggleDone(t){
  t.done=!t.done;
  renderAll();
  await api('tasks.php',{method:'PUT',body:{id:t.id,done:t.done}});
  await refreshLists(); renderSidebar();
  showToast(t.done?'Task completed':'Task marked incomplete', async ()=>{
    t.done=!t.done; renderAll();
    await api('tasks.php',{method:'PUT',body:{id:t.id,done:t.done}});
    await refreshLists(); renderSidebar();
  });
}

$('#addInput').addEventListener('keydown', async (e)=>{
  if(e.key==='Enter'){
    const val=e.target.value.trim();
    if(!val || !ui.activeList)return;
    e.target.value='';
    const t=await api('tasks.php',{method:'POST',body:{listId:ui.activeList,title:val}});
    state.tasks.push(t);
    renderTasks();
    await refreshLists(); renderSidebar();
  }
});

function renderDetails(){
  const t=state.tasks.find(x=>x.id===ui.selectedTask);
  if(!t){ detailsInner.innerHTML=`<div style="color:var(--muted);font-size:13.5px;padding-top:40px;text-align:center;">Select a task to see details</div>`; return; }
  const subHtml=t.subtasks.map(s=>`
    <div class="subtask-row" data-id="${s.id}">
      <button class="checkbox ${s.done?'done':''}" style="width:16px;height:16px;">${s.done?'✓':''}</button>
      <input type="text" value="${escapeAttr(s.title)}">
      <button class="icon-btn subdel">✕</button>
    </div>`).join('');
  const doneCount=t.subtasks.filter(s=>s.done).length;
  detailsInner.innerHTML=`
    <button class="close-details" id="closeDetails">✕</button>
    <h3>Task details</h3>
    <div class="field-label">Title</div>
    <input type="text" id="f-title" value="${escapeAttr(t.title)}">
    <div class="field-label">Description</div>
    <textarea id="f-desc" placeholder="Add description">${t.desc||''}</textarea>
    <div class="field-label">Due date</div>
    <input type="date" id="f-date" value="${t.dueDate||''}">
    <div class="field-label">Due time</div>
    <input type="time" id="f-time" value="${t.dueTime||''}">
    <div class="field-label">Repeat</div>
    <select id="f-repeat">
      ${['none','daily','weekly','monthly','yearly'].map(r=>`<option value="${r}" ${t.repeat===r?'selected':''}>${r==='none'?'Does not repeat':r[0].toUpperCase()+r.slice(1)}</option>`).join('')}
    </select>
    <div class="field-label">Assigned to</div>
    <select id="f-assignee">
      <option value="">Unassigned</option>
      ${state.people.map(p=>`<option value="${p.id}" ${t.assigneeId===p.id?'selected':''}>${escapeAttr(p.name)}</option>`).join('')}
      <option value="__add__">+ Add person...</option>
    </select>
    <div class="field-label">Subtasks</div>
    ${t.subtasks.length?`<div class="subtask-progress">${doneCount} of ${t.subtasks.length} completed</div>`:''}
    <div id="subList">${subHtml}</div>
    <button class="add-subtask" id="addSub">+ Add subtask</button>
    <div class="field-label">Notes</div>
    <textarea id="f-notes" placeholder="Add notes">${t.notes||''}</textarea>
    <div class="details-actions">
      <button class="btn primary" id="f-complete">${t.done?'Mark incomplete':'Mark complete'}</button>
      <button class="btn danger" id="f-delete">Delete</button>
    </div>
    <div class="field-label">Move to list</div>
    <select id="f-move">${state.lists.map(l=>`<option value="${l.id}" ${l.id===t.listId?'selected':''}>${escapeAttr(l.name)}</option>`).join('')}</select>
  `;
  $('#closeDetails').onclick=()=>{ui.selectedTask=null; renderTasks(); renderDetails(); details.classList.remove('open');};
  $('#f-title').onblur=async (e)=>{t.title=e.target.value.trim()||t.title; renderTasks(); await api('tasks.php',{method:'PUT',body:{id:t.id,title:t.title}});};
  $('#f-desc').onblur=async (e)=>{t.desc=e.target.value; renderTasks(); await api('tasks.php',{method:'PUT',body:{id:t.id,desc:t.desc}});};
  $('#f-date').onchange=async (e)=>{t.dueDate=e.target.value; renderTasks(); renderDetails(); await api('tasks.php',{method:'PUT',body:{id:t.id,dueDate:t.dueDate}});};
  $('#f-time').onchange=async (e)=>{t.dueTime=e.target.value; renderTasks(); await api('tasks.php',{method:'PUT',body:{id:t.id,dueTime:t.dueTime}});};
  $('#f-repeat').onchange=async (e)=>{t.repeat=e.target.value; await api('tasks.php',{method:'PUT',body:{id:t.id,repeat:t.repeat}});};
  $('#f-assignee').onchange=async (e)=>{
    if(e.target.value==='__add__'){
      const name=prompt('Person name');
      if(name&&name.trim()){
        const p=await api('people.php',{method:'POST',body:{name:name.trim()}});
        state.people.push(p); t.assigneeId=p.id;
        await api('tasks.php',{method:'PUT',body:{id:t.id,assigneeId:t.assigneeId}});
      }
      renderDetails(); renderTasks();
      return;
    }
    t.assigneeId=e.target.value; renderTasks();
    await api('tasks.php',{method:'PUT',body:{id:t.id,assigneeId:t.assigneeId}});
  };
  $('#f-notes').onblur=async (e)=>{t.notes=e.target.value; await api('tasks.php',{method:'PUT',body:{id:t.id,notes:t.notes}});};
  $('#f-move').onchange=async (e)=>{
    t.listId=e.target.value;
    await api('tasks.php',{method:'PUT',body:{id:t.id,listId:t.listId}});
    ui.selectedTask=null;
    await refreshLists();
    await loadTasksForActiveList();
    renderAll();
  };
  $('#f-complete').onclick=()=>{toggleDone(t); renderDetails();};
  $('#f-delete').onclick=()=>{
    confirmDialog('Delete this task?',async ()=>{
      const idx=state.tasks.findIndex(x=>x.id===t.id);
      const removed=state.tasks.splice(idx,1)[0];
      ui.selectedTask=null; renderAll(); details.classList.remove('open');
      await api('tasks.php?id='+encodeURIComponent(t.id),{method:'DELETE'});
      await refreshLists(); renderSidebar();
      showToast('Task deleted', async ()=>{
        const nt=await api('tasks.php',{method:'POST',body:{listId:removed.listId,title:removed.title}});
        Object.assign(nt, removed, {id:nt.id});
        state.tasks.splice(idx,0,nt);
        await api('tasks.php',{method:'PUT',body:{id:nt.id,desc:nt.desc,dueDate:nt.dueDate,dueTime:nt.dueTime,repeat:nt.repeat,notes:nt.notes,assigneeId:nt.assigneeId,done:nt.done}});
        renderAll(); await refreshLists(); renderSidebar();
      });
    });
  };
  $('#addSub').onclick=async ()=>{
    const s=await api('subtasks.php',{method:'POST',body:{taskId:t.id,title:'New subtask'}});
    t.subtasks.push(s);
    renderDetails(); renderTasks();
  };
  detailsInner.querySelectorAll('.subtask-row').forEach(row=>{
    const sid=row.getAttribute('data-id');
    const s=t.subtasks.find(x=>x.id===sid);
    row.querySelector('.checkbox').onclick=async ()=>{s.done=!s.done; renderDetails(); renderTasks(); await api('subtasks.php',{method:'PUT',body:{id:sid,done:s.done}});};
    row.querySelector('input[type=text]').onblur=async (e)=>{s.title=e.target.value.trim()||s.title; renderTasks(); await api('subtasks.php',{method:'PUT',body:{id:sid,title:s.title}});};
    row.querySelector('.subdel').onclick=async ()=>{t.subtasks=t.subtasks.filter(x=>x.id!==sid); renderDetails(); renderTasks(); await api('subtasks.php?id='+encodeURIComponent(sid),{method:'DELETE'});};
  });
}
function escapeAttr(s){return (s||'').replace(/"/g,'&quot;');}

function confirmDialog(msg,onYes){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="confirm-box"><p>${msg}</p><div class="row"><button class="btn" id="cno">Cancel</button><button class="btn danger" id="cyes">Delete</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cno').onclick=()=>ov.remove();
  ov.querySelector('#cyes').onclick=()=>{ov.remove(); onYes();};
}
function showToast(msg,onUndo){
  const host=$('#toastHost'); host.innerHTML='';
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span>${msg}</span><button>Undo</button>`;
  el.querySelector('button').onclick=()=>{host.innerHTML=''; onUndo();};
  host.appendChild(el);
  setTimeout(()=>{ if(host.contains(el)) host.innerHTML=''; },4000);
}

// people
$('#peopleBtn').onclick=()=>{
  const ov=document.createElement('div'); ov.className='search-box';
  ov.innerHTML=`<div class="search-panel"><h3 style="margin:0 0 10px;font-size:15px;">People</h3><div id="pList"></div><div class="people-add"><input type="text" id="pNameInput" placeholder="Person name"><button class="btn primary" id="pAddBtn">Add</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=(e)=>{if(e.target===ov) ov.remove();};
  const list=ov.querySelector('#pList');
  function renderPeople(){
    list.innerHTML='';
    if(!state.people.length){ list.innerHTML=`<div style="color:var(--muted);font-size:13px;padding:6px 0;">No people added yet.</div>`; return; }
    state.people.forEach(p=>{
      const row=document.createElement('div'); row.className='people-row';
      row.innerHTML=`<span></span><button class="icon-btn">🗑</button>`;
      row.querySelector('span').textContent=p.name;
      row.querySelector('button').onclick=()=>{
        confirmDialog(`Remove "${p.name}" and unassign their tasks?`,async ()=>{
          await api('people.php?id='+encodeURIComponent(p.id),{method:'DELETE'});
          state.tasks.forEach(t=>{if(t.assigneeId===p.id)t.assigneeId='';});
          state.people=state.people.filter(x=>x.id!==p.id);
          renderPeople(); renderTasks(); renderDetails();
        });
      };
      list.appendChild(row);
    });
  }
  renderPeople();
  ov.querySelector('#pAddBtn').onclick=async ()=>{
    const input=ov.querySelector('#pNameInput');
    const name=input.value.trim();
    if(!name)return;
    const p=await api('people.php',{method:'POST',body:{name}});
    state.people.push(p);
    input.value='';
    renderPeople();
  };
};

// search
$('#searchBtn').onclick=()=>{
  const ov=document.createElement('div'); ov.className='search-box';
  ov.innerHTML=`<div class="search-panel"><input type="text" placeholder="Search tasks, descriptions, notes, subtasks" id="sInput"><div id="sResults"></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=(e)=>{if(e.target===ov) ov.remove();};
  const input=ov.querySelector('#sInput'); input.focus();
  const results=ov.querySelector('#sResults');
  let debounce;
  input.oninput=()=>{
    clearTimeout(debounce);
    const q=input.value.trim();
    if(!q){ results.innerHTML=''; return; }
    debounce=setTimeout(async ()=>{
      const matches=await api('search.php?q='+encodeURIComponent(q));
      results.innerHTML='';
      if(!matches.length){ results.innerHTML=`<div style="padding:10px;color:var(--muted);font-size:13px;">No results</div>`; return; }
      matches.forEach(m=>{
        const r=document.createElement('div'); r.className='search-result';
        r.innerHTML=`<div>${m.title}</div><div class="ctx">${m.listName}</div>`;
        r.onclick=async ()=>{
          ui.activeList=m.listId; ov.remove();
          await loadTasksForActiveList();
          ui.selectedTask=m.id;
          renderAll(); openDetailsMobile();
        };
        results.appendChild(r);
      });
    },250);
  };
};

// mobile nav
function isMobile(){return window.innerWidth<=900;}
function closeSidebarMobile(){ if(isMobile()){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); } }
function openDetailsMobile(){ if(isMobile()){ details.classList.add('open'); } }
function setupMobile(){
  if(isMobile()){
    $('#menuBtn').style.display='inline-flex';
    $('#menuBtn').onclick=()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('open'); };
    $('#scrim').onclick=closeSidebarMobile;
  } else {
    $('#menuBtn').style.display='none';
  }
}
window.addEventListener('resize',setupMobile);
setupMobile();

init();
</script>
</body>
</html>
